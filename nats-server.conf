# One account per app; each password is read from the environment and the server refuses to start without it.
server_name: altalune-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: 4G
  max_memory_store: 64M
}

accounts {
  ALTEMPL {
    jetstream { max_file: 1G, max_mem: 16M }
    users: [{ user: altempl, password: $ALTEMPL_NATS_PASSWORD }]
  }
  OPENWA {
    jetstream { max_file: 1G, max_mem: 16M }
    users: [{ user: openwa, password: $OPENWA_NATS_PASSWORD }]
  }
  YASAKU {
    jetstream { max_file: 1G, max_mem: 16M }
    users: [{ user: yasaku, password: $YASAKU_NATS_PASSWORD }]
  }
}
